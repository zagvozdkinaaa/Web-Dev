<h1>Album Details</h1>

@if (album$ | async; as album) {
  <p><b>ID:</b> {{ album.id }}</p>
  <p><b>User ID:</b> {{ album.userId }}</p>

  <label class="label">
    Title:
    <input type="text" [(ngModel)]="editedTitle" />
  </label>

  <div class="actions">
    <button type="button" (click)="backToAlbums()">Back</button>
    <button type="button" [disabled]="saving()" (click)="save(album)">
      {{ saving() ? 'Saving…' : 'Save' }}
    </button>
    <a [routerLink]="['photos']">View Photos →</a>
    @if (saved()) {
      <span class="saved">Saved</span>
    }
  </div>

  <hr />

  <router-outlet />
} @else {
  <p>Loading…</p>
}
