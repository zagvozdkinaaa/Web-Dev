<h1>Albums</h1>

@if (loading$ | async) {
  <p>Loading…</p>
} @else {
  @if (albums$ | async; as albums) {
    @if (albums.length === 0) {
      <p>No albums.</p>
    } @else {
      <ul class="list">
        @for (album of (albums | slice:0:50); track album.id) {
          <li class="item">
            <a class="link" [routerLink]="['/albums', album.id]">
              <span class="id">#{{ album.id }}</span>
              <span class="title">{{ album.title }}</span>
            </a>

            <button
              type="button"
              [disabled]="deletingId() === album.id"
              (click)="deleteAlbum(album.id, $event)"
            >
              {{ deletingId() === album.id ? 'Deleting…' : 'Delete' }}
            </button>
          </li>
        }
      </ul>
    }
  }
}
